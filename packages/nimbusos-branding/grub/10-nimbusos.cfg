# /etc/default/grub.d/10-nimbusos.cfg - NimbusOS boot menu (nimbusos-branding)
#
# Read by update-grub after /etc/default/grub. It names the entries
# "NimbusOS", which also makes grub-install use EFI/nimbusos/; Calamares
# installs with the same EFI bootloader id (docs/PLAN.md NOTE-07). It also
# selects the NimbusOS theme, and adds "splash" to the kernel command line
# for the Plymouth boot splash, keeping whatever /etc/default/grub already
# sets. To undo any of it, edit or remove this file and run: sudo update-grub
GRUB_DISTRIBUTOR="@NIMBUS_NAME@"
GRUB_THEME="/usr/share/grub/themes/nimbusos/theme.txt"
case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
	*" splash "*) ;;
	*) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }splash" ;;
esac
