# /etc/sddm.conf.d/10-nimbusos.conf - NimbusOS login screen (nimbusos-branding)
#
# The "nimbus" theme (Qt 6 greeter) and the Breeze cursor. The session list
# starts on the last-used session; new installs start on Plasma (Wayland)
# (docs/PLAN.md NOTE-08). Autologin, if chosen in the installer, is written to
# /etc/sddm.conf by Calamares and is not affected by this file.
#
# InputMethod is empty: SDDM's default, qtvirtualkeyboard, opens a full-width
# on-screen keyboard over the login card whenever a field gets focus, which the
# nimbus theme doesn't manage (found in the QEMU test, docs/PLAN.md NOTE-72).

[General]
InputMethod=

[Theme]
Current=nimbus
CursorTheme=breeze_cursors
