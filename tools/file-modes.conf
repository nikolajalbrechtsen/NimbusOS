# =============================================================================
# tools/file-modes.conf — which files in the repository must be executable
# =============================================================================
# What: one bash glob per line (repository-relative; "*" also matches "/").
#       A tracked file that matches a line must have mode 100755 in git;
#       every other tracked file must have mode 100644. Symbolic links are
#       not allowed. tools/check-file-modes.sh enforces this (CI).
# Why:  builds take file modes from git, not from the file system (Windows
#       checkouts show every file as executable), so git must be right.
#       Listing executables by role, not by "starts with #!", keeps Python
#       modules non-executable even if they carry a shebang.
# =============================================================================

# Build and repository tools
build/build.sh
tools/*.sh
tools/tests/*.sh

# Debian packaging: debian/rules and maintainer scripts
packages/*/debian/rules
packages/*/debian/preinst
packages/*/debian/postinst
packages/*/debian/prerm
packages/*/debian/postrm
packages/*/tests/*.sh

# Programs shipped by packages
packages/nimbusos-release/nimbus-update/nimbus-update
packages/nimbusos-release/flathub/nimbus-flathub-setup

# live-build hooks and live-only helper scripts (deliverables 6 and 7)
build/config/hooks/live/*.hook.chroot
build/config/includes.chroot_after_packages/usr/lib/nimbusos-live/*

# Nimbus Control Center entry points and integration tests (deliverable 8)
control-center/bin/*
control-center/privd/nimbus-privd.py
control-center/tests/integration/*.sh
