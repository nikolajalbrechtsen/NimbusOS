# =============================================================================
# config/bootloaders/syslinux_common/stdmenu.cfg: ISOLINUX menu colours
# =============================================================================
# What: live-build's layout (rows, positions) with Nimbus Dark colours on the
#       splash background: light text, the selected entry in the accent blue
#       (#6cc4ff) with dark text. Colours are ARGB.
# Why:  docs/PLAN.md NOTE-64: the BIOS menu looks like the UEFI one.
# =============================================================================
menu background splash.png
menu color title	* #ffe7eef8 *
menu color border	* #00000000 #00000000 none
menu color unsel	* #ffc9d3e1 #00000000 none
menu color sel		* #ff06182a #ff6cc4ff none
menu color hotkey	* #ff6cc4ff #00000000 none
menu color hotsel	* #ff06182a #ff6cc4ff none
menu color tabmsg	* #ff8d9db3 #00000000 none
menu color timeout_msg	* #ff8d9db3 #00000000 none
menu color timeout	* #ffe7eef8 #00000000 none
menu color help		37;40 #ffdddd00 #00000000 none
menu vshift 12
menu rows 10
menu helpmsgrow 15
# The command line must be at least one line from the bottom.
menu cmdlinerow 16
menu timeoutrow 16
menu tabmsgrow 18
menu tabmsg Press ENTER to start, or TAB to edit the entry
