# =============================================================================
# config/bootloaders/syslinux_common/menu.cfg: ISOLINUX main menu (BIOS)
# =============================================================================
# What: live-build's menu with a NimbusOS title: the live entries
#       (live.cfg, from live.cfg.in) and live-build's Utilities submenu.
#       There is no Debian installer on the medium, so no installer entries.
# Why:  docs/PLAN.md NOTE-64.
# =============================================================================
menu hshift 0
menu width 82

menu title @NIMBUS_NAME@
include stdmenu.cfg
include live.cfg
menu begin utilities
	menu label ^Utilities
	menu title Utilities
	include stdmenu.cfg
	label mainmenu
		menu label ^Back..
		menu exit
	include utilities.cfg
menu end

menu clear
