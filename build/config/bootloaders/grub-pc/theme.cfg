# =============================================================================
# config/bootloaders/grub-pc/theme.cfg: the live GRUB menu's look
# =============================================================================
# What: loads the three Inter fonts and the nimbusos GRUB theme from
#       live-theme/, which build.sh copies from the nimbusos-branding package
#       (the same theme installed systems use). Sourced by config.cfg and by
#       each submenu.
# Why:  docs/PLAN.md §2 step 4 and NOTE-64: live and installed boot share one
#       theme. GRUB doesn't load a theme's fonts by itself (grub-mkconfig
#       writes loadfont lines for installed systems; this file does it here).
# =============================================================================
set color_normal=light-gray/black
set color_highlight=white/dark-gray

loadfont /boot/grub/live-theme/inter-regular-16.pf2
loadfont /boot/grub/live-theme/inter-bold-16.pf2
loadfont /boot/grub/live-theme/inter-bold-28.pf2
set theme=/boot/grub/live-theme/theme.txt
