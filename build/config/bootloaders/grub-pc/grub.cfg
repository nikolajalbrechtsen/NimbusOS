# =============================================================================
# config/bootloaders/grub-pc/grub.cfg: the live medium's GRUB menu (UEFI)
# =============================================================================
# What: replaces live-build's template. Its generated entries are titled
#       "Live system (amd64)", so this menu has NimbusOS's own three, using
#       live-build's kernel, initrd and boot-option tokens (the way its
#       template suggests for extra entries):
#         Start NimbusOS                  the normal live session
#         Start NimbusOS (safe graphics)  the same with nomodeset
#         Start NimbusOS (fail-safe mode) live-build's fail-safe options
#       plus live-build's Utilities submenu. Starts the first entry after
#       10 seconds; the nimbusos GRUB theme shows the countdown.
# Why:  docs/PLAN.md NOTE-64. Comments here avoid live-build's bare token
#       names and double slashes: its sed rewrites them in every line.
# =============================================================================
source /boot/grub/config.cfg

set timeout=10
set timeout_style=menu

menuentry "Start @NIMBUS_NAME@" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Start @NIMBUS_NAME@ (safe graphics)" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

menuentry "Start @NIMBUS_NAME@ (fail-safe mode)" --hotkey=f {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
