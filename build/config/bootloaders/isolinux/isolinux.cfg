# =============================================================================
# config/bootloaders/isolinux/isolinux.cfg: ISOLINUX entry point (BIOS)
# =============================================================================
# What: live-build's file with a 10-second timeout (in tenths of a second)
#       instead of waiting forever, like the GRUB menu.
# Why:  docs/PLAN.md NOTE-64: an unattended boot (for example the QEMU smoke
#       test in docs/TESTING.md) starts NimbusOS by itself.
# =============================================================================
include menu.cfg
default vesamenu.c32
prompt 0
timeout 100
