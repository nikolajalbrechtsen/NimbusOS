# =============================================================================
# /etc/calamares/settings.conf: the NimbusOS installer (live session only)
# =============================================================================
# What: Debian's Calamares sequence (calamares-settings-debian 13.0.13) with
#       three changes:
#         - branding "nimbusos" (/usr/share/calamares/branding/nimbusos from
#           nimbusos-branding);
#         - Debian's sources-final is replaced by nimbus-sources-final, which
#           writes deb822 Debian sources with all four archive areas
#           (docs/PLAN.md NOTE-06);
#         - nimbus-target-cleanup runs last before unmounting and removes the
#           live-session-only files from the installed system (NOTE-63).
#       Both run inside the target (dontChroot: false).
# Why:  replaces calamares-settings-debian's copy inside the live image
#       (includes.chroot_after_packages are copied after the packages);
#       Calamares' packages step purges that package from the target.
# =============================================================================
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     nimbus-sources-final
  module: shellprocess
  config: shellprocess_nimbus-sources-final.conf
- id:     nimbus-target-cleanup
  module: shellprocess
  config: shellprocess_nimbus-target-cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - shellprocess@nimbus-sources-final
  - shellprocess@nimbus-target-cleanup
  - umount
- show:
  - finished

branding: nimbusos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
