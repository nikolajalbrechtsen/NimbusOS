# =============================================================================
# /etc/calamares/modules/welcome.conf: install requirements
# =============================================================================
# What: Debian's checks (calamares-settings-debian 13.0.13) with NimbusOS's
#       minimums: 32 GB of disk and 4 GB of memory. The links on the welcome
#       page come from the nimbusos branding.
# Why:  a policy choice (docs/PLAN.md NOTE-63): the system disk holds Plasma,
#       Docker, libvirt/QEMU, app images and the ISO library, and Plasma with
#       Docker and a VM needs memory to spare. Shares and VM disks normally
#       live on other disks. Deliverable 11 checks the installed size
#       against these numbers.
# =============================================================================
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true
requirements:
    requiredStorage:    32
    requiredRam:        4.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
