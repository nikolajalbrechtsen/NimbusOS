# =============================================================================
# /etc/calamares/modules/packages.conf: what the installer removes
# =============================================================================
# What: removes (apt-get --purge remove, then autoremove) the live-only
#       packages from the installed system: Debian's list
#       (calamares-settings-debian 13.0.13) plus calamares itself, which
#       Debian's list leaves installed.
# Why:  an installed NimbusOS has no use for the installer (docs/PLAN.md
#       NOTE-06, NOTE-63). Packages that aren't installed are skipped by apt.
# =============================================================================
backend: apt
operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
      - 'calamares'
