# =============================================================================
# shellprocess_nimbus-target-cleanup.conf: remove live-only files from target
# =============================================================================
# What: runs /usr/lib/nimbusos-live/target-cleanup inside the installed
#       system as the last step before unmounting. It removes every file
#       listed in /usr/lib/nimbusos-live/live-files (written at image build
#       time from includes.chroot_after_packages), disabling units first.
# Why:  docs/PLAN.md NOTE-63: the Docker tmpfs and the live launchers must not
#       reach an installed system. A failure stops the install.
# =============================================================================
---
dontChroot: false
timeout: 120
script:
    - command: "/usr/lib/nimbusos-live/target-cleanup"
      timeout: 60
