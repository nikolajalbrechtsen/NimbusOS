# =============================================================================
# shellprocess_nimbus-sources-final.conf: final APT sources of the target
# =============================================================================
# What: runs /usr/lib/nimbusos-live/sources-final inside the installed
#       system (it came with the copied image) after the installation
#       medium's temporary source is gone.
# Why:  replaces Debian's sources-final (docs/PLAN.md NOTE-06). A failure
#       stops the install: a system without working Debian sources would
#       never get security updates.
# =============================================================================
---
dontChroot: false
timeout: 120
script:
    - command: "/usr/lib/nimbusos-live/sources-final"
      timeout: 60
