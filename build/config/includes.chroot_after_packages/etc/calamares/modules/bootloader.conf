# =============================================================================
# /etc/calamares/modules/bootloader.conf: GRUB on the installed system
# =============================================================================
# What: Debian's settings (calamares-settings-debian 13.0.13) plus
#       efiBootloaderId "@NIMBUS_ID@": grub-install writes EFI/@NIMBUS_ID@/,
#       the directory Debian's GRUB packages also use later, because
#       nimbusos-branding sets GRUB_DISTRIBUTOR=@NIMBUS_NAME@ and Debian's
#       postinst lowercases it (docs/PLAN.md NOTE-07). installEFIFallback
#       also writes EFI/BOOT/BOOTX64.EFI.
# Why:  installer and later GRUB upgrades must agree on the EFI directory.
# =============================================================================
---
efiBootLoader: "grub"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "@NIMBUS_ID@"
installEFIFallback: true
