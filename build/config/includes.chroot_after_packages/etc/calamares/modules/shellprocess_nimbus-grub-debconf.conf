# =============================================================================
# shellprocess_nimbus-grub-debconf.conf: GRUB's own upgrades must work
# =============================================================================
# What: runs /usr/lib/nimbusos-live/grub-debconf inside the installed system
#       right after Calamares' bootloader step. On BIOS it sets debconf's
#       grub-pc/install_devices to the disk whose Master Boot Record now
#       holds GRUB; on UEFI it sets grub2/force_efi_extra_removable and has
#       Debian's grub-install put shim, GRUB and MokManager on the fallback
#       path EFI/BOOT.
# Why:  docs/PLAN.md NOTE-72: without it, grub-pc's next upgrade fails
#       non-interactively and blocks every later update, and a UEFI machine
#       without NimbusOS's boot entry can't start it (Secure Boot refuses
#       Calamares' own fallback copy).
# =============================================================================
---
dontChroot: false
timeout: 120
script:
    - command: "/usr/lib/nimbusos-live/grub-debconf"
      timeout: 90
