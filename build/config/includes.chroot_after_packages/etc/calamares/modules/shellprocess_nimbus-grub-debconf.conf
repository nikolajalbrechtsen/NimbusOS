# =============================================================================
# shellprocess_nimbus-grub-debconf.conf: record where GRUB went (BIOS installs)
# =============================================================================
# What: runs /usr/lib/nimbusos-live/grub-debconf inside the installed system
#       right after Calamares' bootloader step. On a BIOS install it sets
#       debconf's grub-pc/install_devices to the disk whose Master Boot
#       Record now holds GRUB; on UEFI it does nothing.
# Why:  docs/PLAN.md NOTE-72: with the question empty, grub-pc's next
#       upgrade fails non-interactively and blocks every later update.
# =============================================================================
---
dontChroot: false
timeout: 60
script:
    - command: "/usr/lib/nimbusos-live/grub-debconf"
      timeout: 30
