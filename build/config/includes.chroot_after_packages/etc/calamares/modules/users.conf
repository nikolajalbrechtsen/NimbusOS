# =============================================================================
# /etc/calamares/modules/users.conf: the first user (live session only)
# =============================================================================
# What: Debian's settings (calamares-settings-debian 13.0.13) plus:
#         - the groups every NimbusOS desktop user joins, so the first user
#           can open the Control Center and run apps and VMs: docker,
#           libvirt, kvm, nimbus-control (NIMBUS_USER_EXTRA_GROUPS,
#           docs/PLAN.md NOTE-45). They must exist in the image; if one
#           doesn't, the install stops with Calamares' "These groups are
#           missing in the target system" instead of quietly making a user
#           without access. Debian's own groups are created if missing, as
#           Debian does.
#         - the default host name "@NIMBUS_HOSTNAME@" (NOTE-06), which the
#           user can change on the same page.
# Why:  the live image's 0900-verify-image hook checks that this list holds
#       every group in NIMBUS_USER_EXTRA_GROUPS.
# =============================================================================
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - name: docker
      must_exist: true
    - name: libvirt
      must_exist: true
    - name: kvm
      must_exist: true
    - name: nimbus-control
      must_exist: true
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "@NIMBUS_HOSTNAME@"
    forbidden_names: [ localhost ]
