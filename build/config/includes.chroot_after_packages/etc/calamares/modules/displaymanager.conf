# =============================================================================
# /etc/calamares/modules/displaymanager.conf: SDDM on the installed system
# =============================================================================
# What: configures SDDM only, and, if the user chose automatic login, logs
#       into Plasma (Wayland): Calamares looks the desktop file up in
#       /usr/share/wayland-sessions/ as well as xsessions/.
# Why:  docs/PLAN.md NOTE-08: the session defaults to Plasma (Wayland);
#       Plasma (X11) stays selectable on the login screen. Debian's file
#       lists seven display managers that NimbusOS doesn't ship.
# =============================================================================
---
displaymanagers:
  - sddm
defaultDesktopEnvironment:
    executable: "startplasma-wayland"
    desktopFile: "plasma"
basicSetup: false
sysconfigSetup: false
