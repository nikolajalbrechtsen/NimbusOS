# shellcheck shell=bash
# =============================================================================
# build/nimbus.conf — every NimbusOS build tunable, in one place
# =============================================================================
# What: Bash variable defaults, read by build/build.sh, tools/build-debs.sh,
#       tools/deb-version.sh and the CI workflows (through build/lib/common.sh).
#
# Why:  ground rule 5. Nothing else in the repository hard-codes a name, URL,
#       mirror, user name, group list or size limit. Values that installed
#       systems need (APT URL, releases.json URL, maintainer, group lists) are
#       copied into the packages and the live-build config at build time as
#       @NIMBUS_*@ tokens (docs/PLAN.md NOTE-49).
#
# Rules:
#   * Every line has the form   : "${NIMBUS_X:=value}"
#     so any value can be overridden from the environment for one build, e.g.
#         sudo NIMBUS_BUILD_MIRROR=http://apt-cache:3142/debian/ ./build/build.sh
#   * No commands, no command substitution. A value may refer to a NIMBUS_*
#     variable defined earlier in this file.
#   * Values that end up on the kernel command line (live session settings)
#     must not contain spaces; build/lib/common.sh checks this.
#   * Paths without a leading "/" are relative to the repository root.
# =============================================================================

# -----------------------------------------------------------------------------
# Identity
# -----------------------------------------------------------------------------
: "${NIMBUS_NAME:=NimbusOS}"                       # product name (os-release NAME)
: "${NIMBUS_ID:=nimbusos}"                         # os-release ID, file and theme names
: "${NIMBUS_GITHUB_REPO:=nikolajalbrechtsen/NimbusOS}"
: "${NIMBUS_HOME_URL:=https://github.com/${NIMBUS_GITHUB_REPO}}"
: "${NIMBUS_BUG_REPORT_URL:=https://github.com/${NIMBUS_GITHUB_REPO}/issues}"

# Debian "Maintainer:" and changelog trailer of every package. This is the
# only place the maintainer's address is written; everything else refers to
# this variable (docs/PLAN.md A11).
: "${NIMBUS_MAINTAINER:=Nikolaj Albrechtsen <nikolaj2503@gmail.com>}"

# -----------------------------------------------------------------------------
# NimbusOS APT repository (published to GitHub Pages by release.yml)
# -----------------------------------------------------------------------------
: "${NIMBUS_APT_URL:=https://nikolajalbrechtsen.github.io/NimbusOS/apt}"
: "${NIMBUS_APT_HOST:=nikolajalbrechtsen.github.io}"   # "Pin: origin" host in apt preferences
: "${NIMBUS_APT_COMPONENT:=main}"
: "${NIMBUS_APT_ORIGIN:=NimbusOS}"                 # Origin: and Label: of the Release files
: "${NIMBUS_APT_SUITES:=stable beta}"              # suites published by tools/publish-apt.sh
: "${NIMBUS_APT_DEFAULT_SUITE:=stable}"            # suite in the packaged nimbusos.sources
: "${NIMBUS_APT_KEEP_VERSIONS:=3}"                 # versions kept per package (rollback window)
: "${NIMBUS_APT_VALID_DAYS:=14}"                   # Valid-Until = signing time + this many days
: "${NIMBUS_RELEASES_JSON_URL:=${NIMBUS_APT_URL}/releases.json}"

# Public archive keys (ASCII-armored *.asc). All of them go into the keyring
# package, so old and new keys can coexist during a rotation (docs/SIGNING.md).
: "${NIMBUS_ARCHIVE_KEYS_DIR:=packages/nimbusos-archive-keyring/keys}"
: "${NIMBUS_ARCHIVE_KEYRING_PATH:=/usr/share/keyrings/nimbusos-archive-keyring.gpg}"

# -----------------------------------------------------------------------------
# Debian base
# -----------------------------------------------------------------------------
: "${NIMBUS_DEBIAN_SUITE:=trixie}"
: "${NIMBUS_DEBIAN_VERSION_ID:=13}"
: "${NIMBUS_ARCH:=amd64}"
: "${NIMBUS_ARCHIVE_AREAS:=main contrib non-free non-free-firmware}"

# Mirrors written into the image (what installed systems use).
: "${NIMBUS_MIRROR:=http://deb.debian.org/debian/}"
: "${NIMBUS_MIRROR_SECURITY:=http://security.debian.org/debian-security/}"

# Mirrors used while building. Point these at a local cache (for example
# apt-cacher-ng) to speed up repeated builds; the image still gets the
# public mirrors above.
: "${NIMBUS_BUILD_MIRROR:=${NIMBUS_MIRROR}}"
: "${NIMBUS_BUILD_MIRROR_SECURITY:=${NIMBUS_MIRROR_SECURITY}}"

# -----------------------------------------------------------------------------
# Docker CE (not in Debian; added through a signed source, NOTE-03 / NOTE-05)
# -----------------------------------------------------------------------------
: "${NIMBUS_DOCKER_APT_URL:=https://download.docker.com/linux/debian}"
# Docker's published signing-key fingerprint:
#   9DC8 5822 9FC7 DD38 854A  E2D8 8D81 803C 0EBF CD88
# build.sh, tools/build-debs.sh and CI refuse a key file with any other
# fingerprint.
: "${NIMBUS_DOCKER_KEY_FPR:=9DC858229FC7DD38854AE2D88D81803C0EBFCD88}"
: "${NIMBUS_DOCKER_KEY_FILE:=build/config/archives/docker.key.chroot}"
: "${NIMBUS_DOCKER_KEYRING_PATH:=/usr/share/keyrings/docker-archive-keyring.gpg}"

# -----------------------------------------------------------------------------
# Users, groups and the live session
# -----------------------------------------------------------------------------
: "${NIMBUS_HOSTNAME:=nimbusos}"                   # live hostname and Calamares default

# Extra groups for desktop users: Calamares users.conf (defaultGroups) and
# /etc/adduser.conf (EXTRA_GROUPS). Space-separated.
: "${NIMBUS_USER_EXTRA_GROUPS:=docker libvirt kvm nimbus-control}"

# Live user (live-config boot parameters).
: "${NIMBUS_LIVE_USERNAME:=nimbus}"
: "${NIMBUS_LIVE_USER_FULLNAME:=NimbusOS}"
# live-config's user-default-groups REPLACES its default list, so the usual
# desktop groups are repeated here. live-config skips groups that don't
# exist. Comma-separated, no spaces.
: "${NIMBUS_LIVE_USER_GROUPS:=audio,cdrom,dip,floppy,video,plugdev,netdev,bluetooth,scanner,lpadmin,docker,libvirt,kvm,nimbus-control}"
: "${NIMBUS_LOCALE:=en_US.UTF-8}"
: "${NIMBUS_KEYBOARD_LAYOUTS:=us}"
: "${NIMBUS_TIMEZONE:=Etc/UTC}"
: "${NIMBUS_BOOT_EXTRA:=quiet splash}"             # extra kernel parameters for live boot

# -----------------------------------------------------------------------------
# Image
# -----------------------------------------------------------------------------
: "${NIMBUS_IMAGE_NAME:=nimbusos}"                 # live-build --image-name (temporary output name)
: "${NIMBUS_ISO_BASENAME:=nimbusos-${NIMBUS_ARCH}}" # final name: <basename>.iso
: "${NIMBUS_ISO_VOLUME_PREFIX:=NimbusOS}"          # volume label = "<prefix> <version>", max 32 chars
: "${NIMBUS_ISO_APPLICATION:=NimbusOS Live}"
: "${NIMBUS_ISO_PUBLISHER:=NimbusOS; ${NIMBUS_HOME_URL}}"
: "${NIMBUS_SQUASHFS_COMPRESSION:=xz}"             # smallest ISO (NOTE-41)
: "${NIMBUS_UEFI_SECURE_BOOT:=auto}"               # use Debian's signed shim/GRUB when available

# GitHub release assets must stay under 2 GiB; bigger ISOs are split into
# parts of this size by tools/split-iso.sh (NOTE-41).
: "${NIMBUS_RELEASE_ASSET_LIMIT_BYTES:=2147483648}"
: "${NIMBUS_ISO_SPLIT_MIB:=1900}"

# -----------------------------------------------------------------------------
# Build host
# -----------------------------------------------------------------------------
: "${NIMBUS_MIN_FREE_GIB:=40}"                     # free space required where build/work lives
: "${NIMBUS_WORK_DIR:=build/work}"                 # live-build working tree (git-ignored)
: "${NIMBUS_OUTPUT_DIR:=dist}"                     # ISO + checksum (git-ignored)
: "${NIMBUS_STAGING_DIR:=_build/src}"              # staged package sources (git-ignored)
: "${NIMBUS_DEBS_DIR:=_build/debs}"                # built .deb files (git-ignored)

# Container image for tools/dev-shell.sh (fully qualified, so Podman never
# has to guess a registry).
: "${NIMBUS_DEV_IMAGE:=docker.io/library/debian:${NIMBUS_DEBIAN_SUITE}}"
