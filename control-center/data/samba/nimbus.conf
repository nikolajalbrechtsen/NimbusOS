# =============================================================================
# /etc/samba/nimbus/nimbus.conf: NimbusOS Samba settings (nimbus-control)
# =============================================================================
# What: the fixed, security-relevant Samba globals. /etc/samba/smb.conf pulls
#       this file in through the one marked include block that the
#       nimbus-control postinst appends (docs/PLAN.md NOTE-23). This file
#       then includes the two files the Control Center generates:
#         /etc/samba/nimbus/settings.conf  workgroup, description, NetBIOS,
#                                          guest mapping (later lines win)
#         /etc/samba/nimbus-shares.conf    the shares
# Why:  keep Debian's smb.conf and ucf handling intact while NimbusOS owns its
#       own settings. This file is a conffile: local edits survive upgrades.
# =============================================================================
[global]
   # Windows 7, macOS 10.10 and newer; no SMB1.
   server min protocol = SMB2_10
   client min protocol = SMB2_10
   ntlm auth = ntlmv2-only
   # Encrypt when the client asks for it (spec Tab C).
   smb encrypt = if_required

   # Friendly to macOS (Finder metadata, resource forks, Time Machine).
   # Each share repeats this list, adding "recycle" where its recycle bin is
   # on, because a share's own "vfs objects" replaces the global one.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

   # Guests use a dedicated account; "map to guest = Bad User" is set in
   # settings.conf only while a Public share exists (NOTE-25).
   guest account = nimbus-guest
   map to guest = Never

   # Discovery: WS-Discovery (wsdd2) for Windows, the generated Avahi
   # service for macOS and Linux. Samba's own mDNS registration is off
   # (NOTE-24). NetBIOS is off unless enabled in Settings.
   multicast dns register = no
   disable netbios = yes
   smb ports = 445

   # No printer sharing.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   include = /etc/samba/nimbus/settings.conf
   include = /etc/samba/nimbus-shares.conf

# Debian's smb.conf defines these three sections before it includes this
# file, so they missed the defaults above (Samba copies the defaults into a
# share when the share is defined). [homes] gets the same encryption and
# macOS settings as every NimbusOS share, because macOS misbehaves when one
# server mixes shares with and without vfs_fruit; the printer shares are
# off, as printing is.
[homes]
   server smb encrypt = if_required
   vfs objects = catia fruit streams_xattr

[printers]
   available = no
   server smb encrypt = if_required
   vfs objects = catia fruit streams_xattr

[print$]
   available = no
   server smb encrypt = if_required
   vfs objects = catia fruit streams_xattr
